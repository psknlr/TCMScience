<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1142 644" width="1142" height="644" role="img" aria-labelledby="t d">
<title id="t">Which evidence licenses which claim</title>
<desc id="d">A matrix of study designs against claim kinds. Classical text licenses attribution and traditional use; bench studies license mechanism hypothesis and mechanism; clinical designs license association, efficacy and safety as marked; the six predictive designs license only a mechanism hypothesis.</desc>
