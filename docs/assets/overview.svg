<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-labelledby="t d">
<title id="t">Fig. 1. TCMScience architecture</title>
<desc id="d">(a) The governance layer (skill manifests, data contracts, a registry and lockfile with human promotion only, and a governance regression of 121 mutants in 26 error classes) constrains the kernel and never executes. (b) A research question enters the trusted kernel, PSH, which labels data at entry, narrows authority through a policy lattice, compiles a typed and bounded plan, calls models and tools only through its gateway, and releases results only through a quarantine-and-verify gate into a hash-chained audit log. (c) The capability plane (117 public connectors with 444 typed operations, 150 native tools in 12 domains, bioagent.tcm, and content-hashed source snapshots) is reached only through the gateway and never trusted.</desc>
