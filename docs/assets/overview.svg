<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
<title id="t">TCMScience architecture</title>
<desc id="d">A research question enters the trusted kernel, which labels data, checks authority, runs a compiled plan through a gateway into the capability plane, and releases results only through a verification gate into a hash-chained audit. The governance layer constrains the kernel from above.</desc>
