name: candidate-benchmark

# The checks a candidate must pass before it can be benchmarked, run on demand and
# on the scout's branch: the lockfile and the tree agree, every skill compiles and
# the kernel accepts it, and the unit tier passes.
#
# It does not benchmark the candidate. No case of a frozen Season is executed
# here, and a pass is not a score. The six tracks of twenty cases are an
# evaluation design with demonstration runs, not a completed validation of
# scientific capability (audit AUD-26). Running them needs a case runner, frozen
# data and scoring rules, the run bound to the candidate's version, and
# independent scoring with results others can check
# (docs/audit-2026-10-response.md).
#
# A candidate that cannot be pinned to an immutable commit will not be
# benchmarked at all: a score against a moving target measures nothing and would
# be quoted anyway.

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: "composite skill id, e.g. some-skill@1.0.0"
        required: true
  pull_request:
    paths:
      - "BioScience-Harness/skills/**"
      - "BioScience-Harness/registry/**"

permissions:
  contents: read

jobs:
  benchmark:
    name: Candidate checks (no benchmark case is run)
    runs-on: ubuntu-latest
    steps:
      - name: Say what this run checks, and what it does not
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          if [ -n "$CANDIDATE" ] && ! [[ "$CANDIDATE" =~ ^[a-z0-9][a-z0-9-]*@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::candidate must be <skill-id>@<major>.<minor>.<patch>"
            exit 1
          fi
          echo "::notice::${CANDIDATE:-this change}: lockfile, compile and unit checks only; no frozen benchmark case is executed, so nothing here is a benchmark score"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install -e "BioScience-Harness[dev]"

      - name: The lockfile and the tree must agree
        working-directory: BioScience-Harness
        env:
          PYTHONPATH: src:../PSH-Harness/src
        run: python scripts/check_lockfile.py

      - name: Every skill compiles and the kernel accepts it
        working-directory: BioScience-Harness
        env:
          PYTHONPATH: src:../PSH-Harness/src
        run: python -m pytest -q tests/test_p0_skills.py tests/test_skill_compiler.py

      - name: Unit tier
        working-directory: BioScience-Harness
        env:
          PYTHONPATH: src:../PSH-Harness/src
        run: python -m pytest -q -m unit
