name: candidate-benchmark

# Benchmark a candidate skill before a human is asked to decide on it: run on
# demand for one candidate, and on a pull request for every track's skill as the
# tree holds it.
#
# What runs: the public conformance Season (benchmarks/registry/conformance-1.yaml,
# cases under benchmarks/conformance/). Each case goes through the governed path
# twice, the bundle records every artifact, output and digest, an independent
# scorer measures the eight dimensions from the bundle and the cases alone, and
# verification re-scores the bundle to the published document (audit AUD-26).
#
# What a pass means: the candidate runs, is reproducible and answers the
# conformance cases correctly, and the machinery that scores it works end to end.
# It is not a benchmark result. The scientific Season's cases are withheld so
# that a clone cannot be tuned to them, so they cannot run here. Whoever holds
# them runs the same command against them and keeps the bundles private:
#   python scripts/benchmark_candidate.py run --candidate <id@ver> \
#     --manifest benchmarks/registry/<season>.yaml --cases <withheld cases> --out ...
#
# A candidate that no lockfile pins runs as an unpinned development run: recorded
# in its audit chain, never attested, never released; the score says so.

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: "composite skill id, e.g. some-skill@1.0.0"
        required: true
  pull_request:
    paths:
      - "BioScience-Harness/skills/**"
      - "BioScience-Harness/registry/**"
      - "BioScience-Harness/benchmarks/**"
      - "BioScience-Harness/src/bioagent/benchmarks/**"
      - "BioScience-Harness/src/bioagent/skills/**"

permissions:
  contents: read

jobs:
  benchmark:
    name: Candidate benchmark (public conformance Season)
    runs-on: ubuntu-latest
    steps:
      - name: Check the candidate's form
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          if [ -n "$CANDIDATE" ] && ! [[ "$CANDIDATE" =~ ^[a-z0-9][a-z0-9-]*@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::candidate must be <skill-id>@<major>.<minor>.<patch>"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install -e "BioScience-Harness[dev]"

      - name: The lockfile and the tree must agree
        working-directory: BioScience-Harness
        env:
          PYTHONPATH: src:../PSH-Harness/src
        run: python scripts/check_lockfile.py

      - name: Every skill compiles and the kernel accepts it
        working-directory: BioScience-Harness
        env:
          PYTHONPATH: src:../PSH-Harness/src
        run: python -m pytest -q tests/test_p0_skills.py tests/test_skill_compiler.py

      - name: Run, score independently and verify
        working-directory: BioScience-Harness
        env:
          PYTHONPATH: src:../PSH-Harness/src
          CANDIDATE: ${{ inputs.candidate }}
          SEASON: benchmarks/registry/conformance-1.yaml
          CASES: benchmarks/conformance
          OUT: ${{ runner.temp }}/bench
        run: |
          if [ -n "$CANDIDATE" ]; then
            python scripts/benchmark_candidate.py run --candidate "$CANDIDATE" \
              --manifest "$SEASON" --cases "$CASES" --out "$OUT/candidate"
            python scripts/benchmark_candidate.py score --bundle "$OUT/candidate" \
              --manifest "$SEASON" --cases "$CASES" --out "$OUT/candidate/scores.json" \
              | tee "$OUT/summary.txt"
            python scripts/benchmark_candidate.py verify --bundle "$OUT/candidate" \
              --scores "$OUT/candidate/scores.json" --manifest "$SEASON" --cases "$CASES"
          else
            python scripts/benchmark_candidate.py season --manifest "$SEASON" \
              --cases "$CASES" --out "$OUT"
          fi
          { echo '```'; cat "$OUT/summary.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the bundles and scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-bundles
          path: ${{ runner.temp }}/bench
          if-no-files-found: ignore
