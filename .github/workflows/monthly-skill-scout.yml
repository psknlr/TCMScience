name: monthly-skill-scout

# The plan's cadence: 10:00 Beijing time on the 1st, which is 02:00 UTC.
#
# What this job may do, and what it may not:
#
#   it MAY  audit and score the candidates in the local skill trees (skills/tcm,
#           skills/candidates, at any depth), build a candidate report and keep it
#           as the run's artifact
#   it MAY NOT promote anything into the stable registry, and it may not touch a
#           frozen benchmark Season
#
# Fetching the sources declared in registry/skill_sources.yaml is not implemented:
# the report notes each one as declared, not fetched. The report is uploaded, not
# opened as a pull request: this repository does not let GitHub Actions create pull
# requests (the scheduled run of 2026-10-01 failed there).
#
# That is not a convention here — `Registry.promote` is the only writer of a
# stable entry and it requires a `PromotionDecision` naming a human. A scheduled
# job would have to forge one, and `PromotionDecision` refuses to accept an empty
# `decided_by`. See docs/adr/0001.

on:
  schedule:
    - cron: "0 2 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scout:
    name: Audit and score the candidate skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install -e "BioScience-Harness[dev]"

      - name: Run the scout over the local skill trees
        working-directory: BioScience-Harness
        env:
          PYTHONPATH: src:../PSH-Harness/src
        shell: bash                      # -o pipefail: the scout's exit, not tee's
        run: |
          python -m bioagent.cli scout \
            --sources registry/skill_sources.yaml \
            --skills skills \
            --out candidate-report.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Refuse the run if any candidate could reach production unreviewed
        working-directory: BioScience-Harness
        run: python scripts/check_no_autopromotion.py candidate-report.json

      - name: Keep the candidate report
        uses: actions/upload-artifact@v4
        with:
          name: candidate-report-${{ github.run_id }}
          path: BioScience-Harness/candidate-report.json
          if-no-files-found: error
