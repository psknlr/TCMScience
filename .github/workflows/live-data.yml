name: live-data

# Tiers 3 and 4 of the validation plan (docs/validation.md): the
# reviewed research files are downloaded from their upstream servers (NPASS and CMAUP from
# bidd.group, LOTUS from Zenodo, STRING, Reactome, UniProt), verified against their reviewed
# checksums, built into the data hub and into research snapshots, queried, and rebuilt to
# check the digests; then the Guizhi Decoction and palpitations benchmark runs on the same
# files with its literature queried live, twice, and its artifacts are compared; and the
# twelve regression scenarios run live against the hub those files built.
#
# The scenarios run under the agent's own scheduling: `tcmstudio validate --approve-jobs`
# starts tcmstudio's runner and sends every scenario call to it over HTTP, as the Studio
# page does. What runs as a job is submitted and followed to the end: docking, ADMET and
# the RNA-seq and single-cell pipelines (their engines are installed here), and the
# research loop, whose research.snapshot job downloads and verifies the research files
# itself before network_pharmacology_run studies 桂枝汤《伤寒论》 on them. Running this
# workflow is the operator's approval of those jobs, and every report says so.
#
# Network-enabled, so not on every push: by hand, weekly, and on a push that changes how
# data are acquired, built, analysed or validated. --strict makes a file that could not be
# downloaded fail the job: a blocked or skipped live test is never a successful one. The
# reports are uploaded whatever happens, and the summary lists every record that did not
# pass with its reason.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"
  push:
    paths:
      - "BioScience-Harness/src/bioagent/acquisition/**"
      - "BioScience-Harness/src/bioagent/sources/**"
      - "BioScience-Harness/src/bioagent/tcmdb/**"
      - "BioScience-Harness/src/bioagent/research/**"
      - "BioScience-Harness/src/bioagent/validation/**"
      - "BioScience-Harness/src/bioagent/analysis/network_pharmacology.py"
      - "BioScience-Harness/src/bioagent/data/benchmark_guizhi_palpitations.json"
      - "BioScience-Harness/src/bioagent/data/formula_errata.json"
      - "studio/runner/src/tcmstudio/scenarios.py"
      - "studio/runner/src/tcmstudio/validate.py"
      - "studio/runner/src/tcmstudio/validate_jobs.py"
      - ".github/workflows/live-data.yml"

permissions:
  contents: read

concurrency:
  group: live-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    name: Real downloads, hub datasets, research snapshots and the benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # AutoDock Vina publishes wheels up to CPython 3.12
          python-version: "3.12"
      - name: Command-line tools the RNA-seq pipeline uses when present
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fastp salmon kallisto hisat2 subread samtools
      - run: python -m pip install --upgrade pip
      - run: >-
          pip install -e PSH-Harness
          -e "BioScience-Harness[formulas,docking,admet,analysis]" -e studio/runner
      - name: The runner
        run: |
          df -h "$RUNNER_TEMP" | tail -1
          python -c "import platform, sys; print(platform.platform(), sys.version.split()[0])"
      - name: "Tier 3: the files from their servers, verified, built, queried and rebuilt"
        id: data
        continue-on-error: true
        run: bioagent validate data --out "$RUNNER_TEMP/reports/data" --work "$RUNNER_TEMP/work" --live --strict
      - name: "Tier 4: the Guizhi Decoction and palpitations benchmark on those files, literature live"
        id: benchmark
        continue-on-error: true
        run: bioagent validate benchmark --out "$RUNNER_TEMP/reports/benchmark" --raw "$RUNNER_TEMP/work/raw" --work "$RUNNER_TEMP/bench" --live --repeat --strict
      - name: "The twelve regression scenarios through the agent's runner, and the core tools, live, on the hub those files built"
        id: scenarios
        continue-on-error: true
        run: >-
          tcmstudio validate --out "$RUNNER_TEMP/reports/scenarios" --tier live --kinds core
          --tcmdb-root "$RUNNER_TEMP/work/tcmdb" --approve-jobs --jobs-timeout 2400
      - name: The scenarios' checks, printed whole
        if: always() && steps.scenarios.outcome != 'skipped'
        run: |
          report="$RUNNER_TEMP/reports/scenarios/agent_regression_report.json"
          test -f "$report" || { echo "no regression report"; exit 0; }
          python - "$report" <<'EOF'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          print("jobs approved:", doc.get("jobs_approved"), "| scenarios:", doc.get("scenarios_run"))
          for r in doc["records"]:
              print(f"== {r['component']}: {r['status']}")
              for c in r["checks"]:
                  print(f"   {c['status']:<10} {c['name']}: {c['detail'][:400]}")
          EOF
      - name: The live downloads, folded into the verification record
        if: always() && steps.data.outcome != 'skipped'
        run: |
          report="$RUNNER_TEMP/reports/data/live_download_validation.json"
          test -f "$report" || { echo "no live download report"; exit 0; }
          # this run's results over the committed record's, file by file
          cp BioScience-Harness/src/bioagent/data/live_download_verification.json "$RUNNER_TEMP/reports/" 2>/dev/null || true
          bioagent validate record --report "$report" --record "$RUNNER_TEMP/reports/live_download_verification.json"
          # printed whole between markers: the committed record
          # (src/bioagent/data/live_download_verification.json) is updated from this text
          echo "----- BEGIN live_download_verification.json -----"
          cat "$RUNNER_TEMP/reports/live_download_verification.json"
          echo "----- END live_download_verification.json -----"
      - name: Summary
        if: always()
        run: bioagent validate summary "$RUNNER_TEMP/reports" --rows 80 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-validation-reports
          path: |
            ${{ runner.temp }}/reports
            ${{ runner.temp }}/bench/artifacts
            ${{ runner.temp }}/bench/snapshot_report.json
          if-no-files-found: warn
          retention-days: 30
      - name: The verdict
        if: always()
        run: |
          echo "tier 3 (data): ${{ steps.data.outcome }}; tier 4 (benchmark): ${{ steps.benchmark.outcome }}; scenarios: ${{ steps.scenarios.outcome }}"
          test "${{ steps.data.outcome }}" = success && test "${{ steps.benchmark.outcome }}" = success && test "${{ steps.scenarios.outcome }}" = success
