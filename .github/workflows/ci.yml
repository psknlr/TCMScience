name: ci

# Workflows only run from the repository root, so this is the one that runs. The copy
# under BioScience-Harness/.github/ is the package's own from before the monorepo and
# is kept for reference.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  psh:
    name: PSH-Harness (trusted kernel + agent runtime)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is PSH-Harness's declared floor (`requires-python = ">=3.11"`).
        # This matrix previously included 3.10, which could never install the
        # package — the old step pip-installed pytest and hypothesis by hand and
        # never installed `psh`, so the contradiction was invisible until the
        # step was changed to use the declared extra.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The extra is declared in PSH-Harness/pyproject.toml; installing by hand
      # here is how the two drifted apart before.
      - run: python -m pip install --upgrade pip && pip install -e "PSH-Harness[test]"
      - name: Full suite
        working-directory: PSH-Harness
        env:
          PYTHONPATH: src
        run: python -m pytest -q
      - name: Byte-compile
        working-directory: PSH-Harness
        run: python -m compileall -q src
      - name: Scientific contract dependency boundaries
        working-directory: PSH-Harness
        run: python scripts/check_scientific_architecture.py

  bioscience:
    name: BioScience-Harness (capability plane) + PSH bridge
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # BioScience-Harness declares >=3.10, but it imports `psh`, whose floor
        # is 3.11 — so the effective floor for the combined install is 3.11. The
        # narrower matrix is the honest one: a 3.10 job cannot install the pair.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e "BioScience-Harness[dev]"
      - name: Unit tier, with the PSH bridge tests (PSH importable from the sibling tree)
        working-directory: BioScience-Harness
        env:
          PYTHONPATH: ../PSH-Harness/src
        run: python -m pytest -q -m unit
      - name: Connector table is self-consistent and its verification record is complete
        working-directory: BioScience-Harness
        run: python -m pytest -q tests/test_public_sources.py
      # The governance ablation: base cases and their mutants through every configuration
      # of the real gates. A regression is the full stack releasing a mutant, or refusing a
      # base case, that the committed results show otherwise (docs/governance-ablation.md).
      - name: Governance ablation (no regression against the committed results)
        working-directory: BioScience-Harness
        run: python scripts/run_governance_ablation.py --check benchmarks/ablation/results.json
      # The inquiry must recover the explanation each planted world makes true, and release
      # a mechanism claim only where the mechanism is that explanation (docs/inquiry.md).
      - name: Inquiry recovers the planted explanations
        working-directory: BioScience-Harness
        run: python scripts/run_inquiry.py --planted all --out "$RUNNER_TEMP/inquiry"
      - name: Release hygiene
        working-directory: BioScience-Harness
        run: python scripts/make_release.py --check
      # The release acceptance: build the sdist and, from it, the wheel, then run a
      # governed skill from the unpacked wheel in a fresh interpreter that cannot see
      # this checkout. A wheel that listed every file and could not run one skill
      # passed the hygiene step above (audit AUD-25).
      - name: Release acceptance (a governed skill runs from the wheel alone)
        working-directory: BioScience-Harness
        env:
          PYTHONPATH: ../PSH-Harness/src
        run: python scripts/make_release.py --outdir "$RUNNER_TEMP/dist"

  analysis-tools:
    # The pipelines run the standard tools when they are installed (fastp, salmon,
    # kallisto, HISAT2, featureCounts). The unit tier above has none, so the tests that
    # need them skip there; here they are installed, and BIOAGENT_REQUIRE_TOOLS turns a
    # missing tool into a failure, so this job cannot pass by skipping. PyDESeq2, Scanpy,
    # leidenalg, umap-learn and tmtools (TM-align) are installed for the comparisons with
    # independent implementations of the methods, and as selectable backends, with
    # harmonypy and GSEApy (docs/omics-backends.md).
    name: Analysis pipelines with the standard tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Command-line tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fastp salmon kallisto hisat2 subread samtools
      - run: python -m pip install --upgrade pip
      - run: pip install -e "BioScience-Harness[dev,analysis]"
      - name: Pipeline tests, every tool present
        working-directory: BioScience-Harness
        env:
          PYTHONPATH: ../PSH-Harness/src
          BIOAGENT_REQUIRE_TOOLS: "1"
        run: python -m pytest -q tests/test_omics_fastq.py tests/test_omics_quant.py tests/test_omics_deseq.py tests/test_omics_rnaseq.py tests/test_omics_skill.py tests/test_omics_scrna.py tests/test_omics_sc_reference.py tests/test_structure.py tests/test_omics_de_backends.py tests/test_omics_sc_backends.py tests/test_omics_gsea.py

  molecular-tools:
    # Docking and ADMET run real software: AutoDock Vina, meeko, RDKit and scikit-learn.
    # The unit tier has none of them, so these tests skip there; here they are installed
    # and the tests run, including the redocking check that validates a setup against a
    # crystal pose and the ADMET models trained from a small archive with known answers.
    name: Molecular modelling with the standard tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e "BioScience-Harness[dev,docking,admet]"
      - name: Docking and ADMET tests, every tool present
        working-directory: BioScience-Harness
        env:
          PYTHONPATH: ../PSH-Harness/src
          BIOAGENT_REQUIRE_TOOLS: "1"
        run: python -m pytest -q tests/test_docking.py tests/test_admet.py tests/test_compute_contracts.py

  integrations:
    # The MCP transport against a real server, BioMCP started through it, the reviewed
    # ToolUniverse tools and PaperQA2's offline index and retrieval. The unit tier runs
    # what needs none of them; here every package is installed and BIOAGENT_REQUIRE_TOOLS
    # turns a skip into a failure. Calls to remote services are marked integration and stay
    # out of CI (docs/mcp-transport.md, docs/tool-providers.md, docs/literature-evidence.md).
    name: MCP, tool providers and literature, with their packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e "BioScience-Harness[dev,mcp,tooluniverse,biomcp,literature]"
      - name: Integration tests, every package present, no network
        working-directory: BioScience-Harness
        env:
          PYTHONPATH: ../PSH-Harness/src
          BIOAGENT_REQUIRE_TOOLS: "1"
        run: python -m pytest -q -m "not integration" tests/test_mcp_transport.py tests/test_biomcp_client.py tests/test_biomcp_adapter.py tests/test_tooluniverse_provider.py tests/test_literature_evidence.py

  mcp-sdk:
    # The transport runs on both majors of the MCP Python SDK (docs/mcp-transport.md). The
    # integrations job resolves to 1.x, because BioMCP and ToolUniverse pin mcp<2; this job
    # runs the transport's tests on the 1.x floor and on 2.x. BioMCP cannot be installed
    # beside 2.x, so its client tests run here without requiring it.
    name: MCP transport on SDK mcp${{ matrix.mcp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mcp: ["==1.29.0", ">=2.2,<3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e "BioScience-Harness[dev,mcp]" "mcp${{ matrix.mcp }}"
      - name: Transport tests, the SDK required
        working-directory: BioScience-Harness
        env:
          PYTHONPATH: ../PSH-Harness/src
          BIOAGENT_REQUIRE_TOOLS: "1"
        run: python -m pytest -q -m "not integration" tests/test_mcp_transport.py
      - name: BioMCP client tests, BioMCP not required
        working-directory: BioScience-Harness
        env:
          PYTHONPATH: ../PSH-Harness/src
        run: python -m pytest -q -m "not integration" tests/test_biomcp_client.py

  toolsagent:
    # SciToolAgent's ToolsAgent service, deployed from its repository at the reviewed
    # commit with the Chemical category, and called through the adapter: answers read as
    # results, errors returned with HTTP 200 as failures, the missing Biology category as
    # UNAVAILABLE, the governed path (docs/compute-tasks.md). The deployment listens on
    # 127.0.0.1 and the functions called compute locally; nothing leaves the runner.
    name: SciToolAgent ToolsAgent, deployed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Deploy ToolsAgent (Chemical category)
        working-directory: BioScience-Harness
        run: scripts/deploy_toolsagent.sh "$RUNNER_TEMP/toolsagent"
      - run: python -m pip install --upgrade pip
      - run: pip install -e "BioScience-Harness[dev,admet]" fastapi uvicorn
      - name: The adapter against the deployed service
        working-directory: BioScience-Harness
        env:
          PYTHONPATH: ../PSH-Harness/src
          BIOAGENT_REQUIRE_TOOLS: "1"
          TOOLSAGENT_URL: http://127.0.0.1:60002
          TOOLSAGENT_CATEGORIES: Chemical
        run: python -m pytest -q tests/test_toolsagent.py
      - name: The service's log
        if: failure()
        run: cat "$RUNNER_TEMP/toolsagent/service.log"

  end-to-end:
    # The three end-to-end cases (docs/end-to-end-cases.md): counts to pathway claims,
    # literature to claims, a compound to a hypothesis. Each runs real implementations, so
    # every one is installed and a missing one fails the job; the script exits non-zero if
    # any drafted claim gets a verdict other than the one its case expects.
    name: End-to-end cases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e "BioScience-Harness[dev,analysis,literature,docking,admet]"
      - name: The cases' tests
        working-directory: BioScience-Harness
        env:
          PYTHONPATH: ../PSH-Harness/src
          BIOAGENT_REQUIRE_TOOLS: "1"
        run: python -m pytest -q tests/test_end_to_end_cases.py
      - name: The cases, with PyDESeq2
        working-directory: BioScience-Harness
        env:
          PYTHONPATH: ../PSH-Harness/src
        run: python scripts/run_end_to_end_cases.py --out "$RUNNER_TEMP/cases" --de-backend pydeseq2

  live-connectors:
    # Opt-in: the public sources are other people's services. Verified on demand, and the
    # record in data/connector_live_verification.csv says when.
    name: Live connector verification (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: BioScience-Harness
        run: PYTHONPATH=src python scripts/verify_connectors.py --no-write
      # The providers' live tests: a Biomni clone at the pinned commit, governed RCSB and
      # ESM Atlas calls through the operation broker, ToolUniverse's UniProt tool, BioMCP's
      # listing and a live lookup through the MCP transport, and DeepWiki's public MCP
      # server reviewed and called over HTTPS.
      - run: python -m pip install --upgrade pip && pip install -e "BioScience-Harness[dev,mcp,tooluniverse,biomcp]"
      - name: Live provider tests (network)
        working-directory: BioScience-Harness
        env:
          PYTHONPATH: ../PSH-Harness/src
        run: python -m pytest -q -m integration tests/test_bindings_licences.py tests/test_operation_broker.py tests/test_tooluniverse_provider.py tests/test_biomcp_adapter.py tests/test_biomcp_client.py tests/test_mcp_transport.py
