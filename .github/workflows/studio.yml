name: studio

# TCMScience Studio (studio/): test every part, build the app, and deploy it with the Tao-S1 relay as the Cloudflare
# Worker "tcmscience-studio" at https://science.impf.ai (studio/edge/README.md, studio/edge/SETUP.md).
# Deploys only from main, and only when the repository has the Cloudflare secrets: CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID; with MINIMAX_API_KEY Tao-S1 is on (without it the site is deployed and Tao-S1 stays off);
# optional VISITOR_SALT, ADMIN_TOKEN (the analytics dashboard /admin/; off without it) and EXPORT_TOKEN (read-only
# aggregated exports). The secrets become the Worker's own; none is printed or written into the repository or the site.
# No telemetry, record or export is ever collected by this workflow or kept in its artifacts (studio/docs/TELEMETRY.md).
# The site bundles PSH-Harness and BioScience-Harness (src, skills, registry) into its Python runtime, and tcmstudio
# imports their internals: a change there is tested, rebuilt and redeployed too (not their docs, tests or data, except
# the committed connector live-verification record, which the site's catalog.json and studio/docs/compat/matrix.csv
# are built from, and the test modules the browser research jobs' native side imports: omics_world, sc_world and
# test_pipeline_references for --mode omics, test_snapshot_pipeline and test_source_parsers for --mode fixture,
# admet_world for --mode admet, and the docking fixtures, tests/fixtures/docking, for --mode dock and
# make_dock_fixtures.py). The READMEs and docs/ restate catalog numbers that doc_facts.py checks, so they
# trigger it too. The browser chemistry and the ADMET jobs' native side are RDKit 2026.9.1 and scikit-learn 1.8.0,
# the versions the browser's RDKit.js and Pyodide's scikit-learn are pinned to: installed at exactly those versions.
# The browser docking runs AutoDock Vina 1.2.7 compiled to WebAssembly (studio/scripts/build_vina_wasm.py, rebuilt
# here from its pins and compared byte for byte); its native side is Vina 1.2.7 with Meeko 0.8.0 and gemmi 0.7.5, the
# release and the preparation the fixtures and the WebAssembly build are pinned to, installed at exactly those.
on:
  push:
    paths:
      - "studio/**"
      - ".github/workflows/studio.yml"
      - "PSH-Harness/src/**"
      - "PSH-Harness/pyproject.toml"
      - "BioScience-Harness/src/**"
      - "BioScience-Harness/skills/**"
      - "BioScience-Harness/registry/**"
      - "BioScience-Harness/pyproject.toml"
      - "BioScience-Harness/setup.py"
      - "BioScience-Harness/data/connector_live_verification.csv"
      - "BioScience-Harness/tests/omics_world.py"
      - "BioScience-Harness/tests/sc_world.py"
      - "BioScience-Harness/tests/test_pipeline_references.py"
      - "BioScience-Harness/tests/test_snapshot_pipeline.py"
      - "BioScience-Harness/tests/test_source_parsers.py"
      - "BioScience-Harness/tests/admet_world.py"
      - "BioScience-Harness/tests/fixtures/docking/**"
      - "BioScience-Harness/README.md"
      - "README.md"
      - "README.zh-CN.md"
      - "docs/**"
      - "中医方剂数据表.xlsx"
  pull_request:
    paths: # the same list
      - "studio/**"
      - ".github/workflows/studio.yml"
      - "PSH-Harness/src/**"
      - "PSH-Harness/pyproject.toml"
      - "BioScience-Harness/src/**"
      - "BioScience-Harness/skills/**"
      - "BioScience-Harness/registry/**"
      - "BioScience-Harness/pyproject.toml"
      - "BioScience-Harness/setup.py"
      - "BioScience-Harness/data/connector_live_verification.csv"
      - "BioScience-Harness/tests/omics_world.py"
      - "BioScience-Harness/tests/sc_world.py"
      - "BioScience-Harness/tests/test_pipeline_references.py"
      - "BioScience-Harness/tests/test_snapshot_pipeline.py"
      - "BioScience-Harness/tests/test_source_parsers.py"
      - "BioScience-Harness/tests/admet_world.py"
      - "BioScience-Harness/tests/fixtures/docking/**"
      - "BioScience-Harness/README.md"
      - "README.md"
      - "README.zh-CN.md"
      - "docs/**"
      - "中医方剂数据表.xlsx"
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER: wrangler@4.148.0
  WRANGLER_SEND_METRICS: "false"
  SITE_URL: ${{ vars.STUDIO_URL || 'https://science.impf.ai' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Edge (the Worker)
        run: node --test studio/edge/test/*.test.js
      # Each suite below runs when its part is in the tree; a part that is there and fails, fails the job.
      - name: Runner (tcmstudio)
        run: |
          if [ ! -f studio/runner/pyproject.toml ]; then
            echo "::notice::studio/runner is not in this tree: no runner tests"
            exit 0
          fi
          python -m pip install --upgrade pip
          # RDKit and scikit-learn at the browser's pins: the runner's ADMET tests (browser_jobs admet_*) skip without;
          # Vina, Meeko and gemmi at the browser docking's: make_dock_fixtures.py --check below needs them
          pip install -e PSH-Harness -e BioScience-Harness -e "studio/runner[test]" pytest rdkit==2026.9.1 scikit-learn==1.8.0 \
            vina==1.2.7 meeko==0.8.0 gemmi==0.7.5
          # every catalog number the READMEs and docs restate, against the catalog itself; the compatibility matrix
          # and the connector coverage report, regenerated and compared (the runner tests below run them too)
          python3 studio/scripts/doc_facts.py --check
          python3 studio/scripts/compat_matrix.py --check
          python3 studio/scripts/connector_coverage.py --check
          if [ -d studio/runner/tests ]; then
            python -m pytest -q studio/runner/tests
          else
            echo "::notice::studio/runner has no tests directory"
          fi
      - name: The browser chemistry's RDKit data and parity fixture, regenerated from native RDKit 2026.9.1
        # make_chem_fixtures.py writes filter_catalogs.json, rdkit_tables.json, RDKit's licence and the parity fixture
        # (web/test/fixtures/chem_parity.json) from native RDKit 2026.9.1 and RDKit's sources at the release tag (from
        # raw.githubusercontent.com); --check fails when a committed file is not what they give
        run: python studio/scripts/make_chem_fixtures.py --check
      - name: The prepared docking fixtures and the browser Vina's native reference, regenerated from native RDKit, Meeko and Vina
        # make_dock_fixtures.py writes the prepared PDBQT fixtures (BioScience-Harness/tests/fixtures/docking/prepared)
        # with RDKit 2026.9.1 and Meeko 0.8.0, and what native Vina 1.2.7 gives on them (web/test/fixtures/
        # vina_parity.json, web/test/fixtures/vina/); --check regenerates the deterministic parts (the inputs, each
        # ligand's text, score() and optimize() of the committed poses, which the WebAssembly engine must give bit for
        # bit) and fails when one differs. The seeded docks were recorded on the machine named there: a Monte Carlo
        # search is not bit-reproducible across CPUs, so they are not part of --check
        run: python studio/scripts/make_dock_fixtures.py --check
      - name: Web (core modules and UI)
        # the Runner step installed tcmstudio into this job's Python: the tests that read a real runner's answers
        # (Settings → Data against /api/datasets) run instead of skipping
        env:
          PYTHON: python
        run: |
          if [ ! -f studio/package.json ]; then
            echo "::notice::studio/package.json is not in this tree: no web tests"
            exit 0
          fi
          cd studio
          npm ci || npm install
          npm test

  vina-wasm:
    # AutoDock Vina 1.2.7 compiled to WebAssembly from its pinned inputs (Emscripten 4.0.23's release binaries, Vina's
    # PyPI sdist, Ubuntu's Boost 1.83 headers; each SHA-256-checked), and every written file compared byte for byte
    # with the committed one (web/js/scientific/dock/vendor, vina_build.json). The inputs (356 MB, nearly all of it
    # Emscripten) are kept between runs in a cache keyed on the three pins' SHA-256, read from the script itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The pinned inputs' cache key
        id: pins
        run: |
          python -c "import runpy; m = runpy.run_path('studio/scripts/build_vina_wasm.py'); print('key=' + '-'.join(m[k]['sha256'][:16] for k in ('EMSCRIPTEN', 'VINA', 'BOOST')))" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vina-wasm-inputs
          key: vina-wasm-inputs-${{ steps.pins.outputs.key }}
      - name: Rebuild the WebAssembly Vina and compare it with the committed build
        run: python studio/scripts/build_vina_wasm.py --check --cache "$RUNNER_TEMP/vina-wasm-inputs"
      - name: Tier S, every fixture ligand × seeds 1-8 (the committed WebAssembly build against the native reference)
        # the search rule over the whole native reference (web/test/fixtures/vina_parity.json): per ligand, the median
        # best score over seeds 1-8 within 0.10 kcal/mol of native's, and the crystal ligand redocked within 2 Å on as
        # many seeds as natively. npm test runs 2 ligands × seeds 1-3 of it; this runs all of it (about 7 min, beside
        # the test job). Node's built-ins only: no npm install
        working-directory: studio
        env:
          VINA_TIER_S: full
        run: node --test --test-name-pattern="Tier S" web/test/scientific/vina.test.mjs

  build:
    needs: [test, vina-wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install what the build reads (the catalog is generated from the code)
        run: |
          python -m pip install --upgrade pip
          pip install -e PSH-Harness -e BioScience-Harness -e studio/runner
          # the native side of the browser ADMET jobs (science.mjs --mode admet): the browser's pins
          pip install rdkit==2026.9.1 scikit-learn==1.8.0
          # the native side of the browser docking job (science.mjs --mode dock): the release its WebAssembly build is
          # (NativeVina refuses any other) and the preparation its fixtures were made with
          pip install vina==1.2.7 meeko==0.8.0 gemmi==0.7.5
      - name: Build the app (studio/_site) with its headers
        run: |
          python3 studio/scripts/build_web.py --out studio/_site
          cp studio/edge/_headers studio/_site/_headers
          test -f studio/_site/index.html || { echo "::error::the build wrote no index.html"; exit 1; }
          # Workers Static Assets: at most 25 MiB a file and 20 000 files (Free plan)
          big="$(find studio/_site -type f -size +25M)"
          if [ -n "$big" ]; then echo "::error::files over 25 MiB cannot be served as Workers assets: $big"; exit 1; fi
          count="$(find studio/_site -type f | wc -l)"
          if [ "$count" -gt 20000 ]; then echo "::error::$count files: Workers Static Assets serves at most 20 000"; exit 1; fi
          echo "studio/_site: $count files, $(du -sh studio/_site | cut -f1)"
      - name: The Worker builds with this site (dry run, no account needed)
        working-directory: studio/edge
        run: npx --yes "$WRANGLER" deploy --dry-run --outdir "$RUNNER_TEMP/worker"
      - name: End-to-end (when the suite is in the tree)
        env:
          STUDIO_SITE: ${{ github.workspace }}/studio/_site
        run: |
          if [ ! -f studio/package.json ] || ! node -e "process.exit(require('./studio/package.json').scripts?.['test:e2e'] ? 0 : 1)"; then
            echo "::notice::no test:e2e script in studio/package.json: no end-to-end tests"
            exit 0
          fi
          cd studio
          npm ci || npm install
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Browser research jobs (Pyodide, its pyarrow, numpy and scipy from jsDelivr, no runner)
        # the site with its test pages. service: research.run and the self-test as jobs of the page's job service (job
        # workers, private storage, checkpoints, receipts), research.run's five tables the native bytes committed in
        # tcmstudio/data/browser_selftest.json. fixture: the snapshot build on raw files mounted read-only from OPFS
        # (the parser tests' fixtures; pytest is what generates them), the snapshot ids equal to the native build's.
        # omics: pipeline.rnaseq (a count matrix) and pipeline.scrna (count tables) as jobs of the page's job service on
        # the references omics_counts_world and sc_world, every output compared with the native command's on the same
        # files at one BLAS thread (identical, within the stated tolerance, or not compared and said so; the genes
        # called, clusters and cell types exactly), the receipts checked, the browser's files held to the known answer
        run: |
          pip install pytest
          python3 studio/scripts/build_web.py --out "$RUNNER_TEMP/site-dev" --dev
          node studio/web/test/runtime/science.mjs --mode service --site "$RUNNER_TEMP/site-dev" --json "$RUNNER_TEMP/science-service.json"
          node studio/web/test/runtime/science.mjs --mode fixture --site "$RUNNER_TEMP/site-dev" --json "$RUNNER_TEMP/science-fixture.json"
          node studio/web/test/runtime/science.mjs --mode omics --site "$RUNNER_TEMP/site-dev" --json "$RUNNER_TEMP/science-omics.json"
      - name: Browser sweep, every browser tool's envelope against native CPython's (Pyodide from jsDelivr, no runner)
        # sweep.mjs: every entry the compatibility matrix runs in the browser (classes 1, 2, 3, 5) and every core tool
        # with the input `tcmstudio validate` gives it, every connector with web access off (refused as network_off on
        # both sides), and the groups beyond (the inputs validate lacks, wrongly typed arguments, the native tools'
        # reference cases, each entry by its own id, the CPU kernels above their thresholds, and the calls that need the
        # formula workbook on a page of their own): made in headless Chromium through BrowserRuntime as the router
        # makes them and natively with the dispatcher's own context, each pair of envelopes held to the runtime check's
        # comparison (run.mjs compareEnvelopes). A difference passes only where sweep.mjs KNOWN declares it, by entry
        # id and field, with its reason; anything else fails. 1,153 calls, about a minute with a local Pyodide
        run: node studio/web/test/runtime/sweep.mjs --site "$RUNNER_TEMP/site-dev" --json "$RUNNER_TEMP/science-sweep.json"
      - name: Browser chemistry, science kernels and the ADMET jobs (RDKit.js, WebGPU on SwiftShader, Pyodide's scikit-learn)
        # chem.browser.mjs: the chemistry worker in Chromium (the vendored loader, npm's RDKit_minimal.wasm checked
        # against the pin, a tampered one refused) prepares the parity corpus to native RDKit's answers.
        # gpu-science.mjs --software: the device check on SwiftShader, a software adapter (exactness of the WGSL against
        # WebAssembly SIMD and JavaScript; its timings are the CPU's, so it says "software, not evidence"; no runner here
        # has a physical GPU); with --software it fails unless the WGSL ran, exact, at every size. webgpu.browser.mjs
        # --software: the sequence kernels' WGSL (js/runtime/webgpu.js) on the same adapter, every integer count against
        # the CPU reference, its known-answer test, and a production SequenceCompute refusing the software adapter.
        # science.mjs --mode admet: admet.models on the known-answer archive (a project file) and
        # pipeline.admet on a molecule set as jobs of the page's job service, RDKit.js and Pyodide from jsDelivr as on
        # science.impf.ai, held exactly to native RDKit 2026.9.1 and scikit-learn 1.8.0 at one thread (the cards apart
        # from file digests, seconds and the chemistry's name; admet.tsv; predictions and domain search; alerts; the
        # refusals the set expects), then once more with the domain search forced onto SwiftShader's WebGPU by the
        # handlers' harness-only switch: the same outputs
        run: |
          (cd studio && (npm ci || npm install) && npx playwright install --with-deps chromium)
          node studio/web/test/runtime/chem.browser.mjs --json "$RUNNER_TEMP/science-chem.json"
          node studio/web/test/runtime/gpu-science.mjs --software --json "$RUNNER_TEMP/science-gpu.json"
          node studio/web/test/runtime/webgpu.browser.mjs --software > "$RUNNER_TEMP/science-webgpu.json"
          node studio/web/test/runtime/science.mjs --mode admet --site "$RUNNER_TEMP/site-dev" --json "$RUNNER_TEMP/science-admet.json"
      - name: Browser docking (AutoDock Vina 1.2.7 in WebAssembly, the Python stages in Pyodide) against native Vina 1.2.7
        # science.mjs --mode dock: pipeline.dock as a job of the page's job service on the prepared fixtures (3PTB's
        # pocket, six ligands, the crystal ligand BEN as the reference; project files), the site's own Vina wasm at
        # boot.json's pin in dedicated workers, Pyodide from jsDelivr. Held natively to: dock_read's plan and the texts
        # Vina was given, byte for byte; run_dock on the browser's own Vina results in CPython, every output the
        # browser's bytes; native Vina's score() of each top pose the browser found, the same float64 bits as the
        # WebAssembly engine's; the runner's command (`bioagent dock … --reference-ligand …`, native Vina, the same
        # seed): both complete, both redock BEN within 2 Å, each ligand's best score reported beside the band measured
        # between native builds (a seeded search is not bit-reproducible across engines; the vina-wasm job holds every
        # fixture ligand × seeds 1-8 to the rule: vina.test.mjs with VINA_TIER_S=full); the receipt's engine, compute
        # facts and device note
        run: node studio/web/test/runtime/science.mjs --mode dock --site "$RUNNER_TEMP/site-dev" --json "$RUNNER_TEMP/science-dock.json"
      - name: Keep the browser research jobs' reports (every check, the page's failures, rows and console)
        # also when a mode failed or timed out, which is when they are read; this workflow's own test runs on the
        # planted and simulated references (digests and sizes of their outputs), nothing of a visitor's
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: science-reports
          path: ${{ runner.temp }}/science-*.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: studio-site
          path: studio/_site
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # one deployment at a time, none cancelled halfway (here rather than on the whole workflow, where a queued run of
    # any branch would displace another branch's pending tests)
    concurrency:
      group: studio
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: studio-site
          path: studio/_site
      - name: Are the secrets set?
        id: secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          missing=""
          [ -n "$CF_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CF_ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::warning::science.impf.ai is not deployed until these repository secrets are set:$missing (studio/edge/SETUP.md)"
            echo "ready=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=1" >> "$GITHUB_OUTPUT"
          if [ -n "$(printf '%s' "$KEY" | tr -d '[:space:]')" ]; then
            echo "model=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no MINIMAX_API_KEY secret: the site is deployed, Tao-S1 keeps whatever key the Worker already has (none on a first deployment: off) (studio/edge/SETUP.md)"
            echo "model=0" >> "$GITHUB_OUTPUT"
          fi
          # RELAY = "off" in wrangler.toml is the owner's persistent pause (SETUP.md), read as the relay reads it: the
          # key is still put (unpausing is RELAY back to "on"), and the check does not require Tao-S1 to answer
          q="[\"']?[[:space:]]*"
          if grep -Eiq "^[[:space:]]*RELAY[[:space:]]*=[[:space:]]*${q}(off|0|false|no)[[:space:]]*${q}(#.*)?\$" studio/edge/wrangler.toml; then
            echo "::notice::RELAY is off in studio/edge/wrangler.toml: Tao-S1 is paused, the check after the deployment does not require it"
            echo "relay_off=1" >> "$GITHUB_OUTPUT"
          else
            echo "relay_off=0" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eiq "^[[:space:]]*SOURCES[[:space:]]*=[[:space:]]*${q}(off|0|false|no)[[:space:]]*${q}(#.*)?\$" studio/edge/wrangler.toml; then
            echo "::notice::SOURCES is off in studio/edge/wrangler.toml: the source gateway is paused"
            echo "sources_off=1" >> "$GITHUB_OUTPUT"
          else
            echo "sources_off=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy the Worker with the app, then give it its secrets
        if: steps.secrets.outputs.ready == '1'
        working-directory: studio/edge
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          VISITOR_SALT: ${{ secrets.VISITOR_SALT }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}
          MODEL: ${{ steps.secrets.outputs.model }}
        # a space or line break pasted with a secret is not part of it; secrets go in on stdin, never as arguments
        run: |
          set -o pipefail
          test -f ../_site/index.html && test -f ../_site/_headers || { echo "::error::the built site or its _headers is missing"; exit 1; }
          # No safeguard for science.impf.ai's DNS here: with stdout not a terminal (CI, and the pipe to tee) wrangler
          # replaces an existing DNS record of that name, or another Worker's custom domain on it, without asking.
          # Checking that the name is free before the first deployment is the owner's (studio/edge/SETUP.md, step 7).
          if ! npx --yes "$WRANGLER" deploy 2>&1 | tee "$RUNNER_TEMP/deploy.log"; then
            if grep -qi "No access to the specified resource" "$RUNNER_TEMP/deploy.log"; then
              echo "::error::the API token cannot reach the zone impf.ai: add it under Zone Resources of the token (studio/edge/SETUP.md, step 2)"
            elif grep -qi "Authentication error" "$RUNNER_TEMP/deploy.log"; then
              echo "::error::Cloudflare refused the API token or the account id (studio/edge/SETUP.md, steps 2-3)"
            fi
            exit 1
          fi
          if [ "$MODEL" = "1" ]; then
            printf '%s' "$MINIMAX_API_KEY" | tr -d '[:space:]' | npx --yes "$WRANGLER" secret put MINIMAX_API_KEY
          fi
          salt="$(printf '%s' "$VISITOR_SALT" | tr -d '[:space:]')"
          if [ -n "$salt" ]; then
            printf '%s' "$salt" | npx --yes "$WRANGLER" secret put VISITOR_SALT
          fi
          # the analytics dashboard and the read-only export token: given to the Worker only when set and at least 32
          # characters (the Worker ignores a shorter one); removing a repository secret does not remove the Worker's own
          for name in ADMIN_TOKEN EXPORT_TOKEN; do
            value="$(printf '%s' "${!name}" | tr -d '[:space:]')"
            if [ -z "$value" ]; then
              if [ "$name" = "ADMIN_TOKEN" ]; then echo "::notice::no ADMIN_TOKEN secret: the analytics dashboard (/admin/) keeps whatever token the Worker already has (none on a first deployment: off) (studio/edge/SETUP.md)"; fi
              continue
            fi
            if [ "${#value}" -lt 32 ]; then
              echo "::warning::the $name secret is shorter than 32 characters and was not given to the Worker (studio/edge/SETUP.md)"
              continue
            fi
            printf '%s' "$value" | npx --yes "$WRANGLER" secret put "$name"
          done
      - name: Check the site, source gateway, dataset relay, telemetry and admin gate, and one tiny Tao-S1 call
        if: steps.secrets.outputs.ready == '1'
        env:
          MODEL: ${{ steps.secrets.outputs.model }}
          RELAY_OFF: ${{ steps.secrets.outputs.relay_off }}
          SOURCES_OFF: ${{ steps.secrets.outputs.sources_off }}
          # used only if the Tao-S1 call fails: the check then asks the upstream directly and prints what it says
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        # a new custom domain and its certificate can take minutes on the first deployment, and a key put a moment
        # ago takes a little while to reach the edge (check.mjs waits for both); Tao-S1 is required to answer only
        # when its key was put and it is not paused (RELAY = "off": health ok:false is then expected)
        run: |
          source_check_args=(--require-telemetry)
          # the dataset relay (browser research jobs): a HEAD of one small reviewed file through it; a failure is a
          # warning, not a failed deploy (the upstream host is outside the site's control)
          if [ "$SOURCES_OFF" != "1" ]; then source_check_args+=(--require-sources --datasets); fi
          if [ "$MODEL" = "1" ] && [ "$RELAY_OFF" != "1" ]; then
            node studio/edge/scripts/check.mjs --url "$SITE_URL" --wait 600 --require-model "${source_check_args[@]}"
          else
            node studio/edge/scripts/check.mjs --url "$SITE_URL" --wait 600 "${source_check_args[@]}"
          fi
