model: []

# Data and services: each record's terms were read on 2026-10-07 from the provider's own
# licence page or file (terms_url); `checked` names exactly what was read and the sha256 of
# it as served. A record attaches to the components that draw on the source: the live
# connectors, the reviewed ToolUniverse tools, the bulk datasets the acquisition layer
# fetches and the operations of governed skills. The eight source cards
# (bioagent/sources/cards.py) still rule on the snapshots a skill run reads.
#
# Not recorded, because the provider states no terms that could be read, so a commercial
# use stays refused as unknown:
#   NPASS   bidd.group/NPASS (home, about, help, download and privacy pages, now
#           version 3.0): no licence or terms of use. The source card's "Free for academic
#           use" is not on these pages.
#   CMAUP   bidd.group/CMAUP (home, about, help, download): "All data can be freely
#           downloaded" and a copyright line, no licence or terms of use.
#   ESM Atlas fold service (api.esmatlas.com): esmatlas.com states no terms. The esm
#           README (facebookresearch/esm at 2b369911) licenses ESM Atlas *data* CC BY 4.0
#           "for academic and commercial use", subject to the Meta Open Source Terms of
#           Use, which by their own text govern only opensource.fb.com; nothing covers
#           what the fold service returns for a submitted sequence.
