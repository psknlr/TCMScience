# licence_records.yaml — the reviewed terms of what a run uses (bioagent.licences).
#
# A commercial run may use an asset only if a record here (or a source card, for data)
# explicitly permits commercial use; an asset without one is refused, never assumed.
# Research use is not gated by this file. Adding or editing a record is a governance
# action, made by a pull request that cites where the terms were read.
#
# code     licence read from the upstream repository's own licence file at a pinned
#          commit, with the sha256 of that text (the file's address is
#          <repo>/blob/<commit>/<licence_path>, recorded as licence_url in a decision);
#          `components` are the catalogue rows whose implementation it is, `modules` the
#          import names it covers.
# model    weights version and digest, licence, permitted purposes, output terms.
# data     version, licence (per record where it differs), commercial use, retention and
#          redistribution. The eight source cards (bioagent/sources/cards.py) are data
#          records already and are not repeated here.
# service  terms reference and version, the account used (a reference, never a secret),
#          permitted purposes, rate limit.
#
# The catalogue rows corrected below all came from Biomni/biomni/env_desc.py, Biomni's
# list of other projects' packages ("[Python Package] ...", "[CLI Tool] ..."), and carried
# Biomni's own Apache-2.0. Each licence was read from the package's own repository; the
# catalogue's value stays on the manifest as LicenseSpec.catalogue, provenance of the row.

api_version: "1"

code:
