    name: Open Targets Platform
    version: "26.09"
    licence: CC0-1.0
    terms_url: https://platform-docs.opentargets.org/licence
    commercial_use: allowed
    retention: no limit (CC0 1.0 public-domain dedication)
    redistribution: without conditions (CC0 1.0); a citation is requested
    components: [public.connector.opentargets]
    checked:
      source: https://platform-docs.opentargets.org/licence (the licence page as served)
      date: "2026-10-07"
      sha256: 40d73aff4407f812a8f490b5a3e30aba67e2804389df117940497a0e825bb2d2
    note: >-
      "Open Targets Platform is marked with CC0 1.0 ... allowing downstream users to
      consume the data without restriction"; its data sources, those marked "commercial
      use for Open Targets" included, "have agreed for their data to be used without
      restriction by all Open Targets users". Data release 26.09 (API 26.9.0), from the
      GraphQL meta query the same day.

