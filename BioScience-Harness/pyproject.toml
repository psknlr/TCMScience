[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bioagent"
version = "0.2.7"
description = "Federating biomedical agent: unified capability registry over 16 open-source biomedical agent projects"
# 3.11, not 3.10: this package imports `psh`, whose floor is 3.11, so a 3.10
# install cannot resolve the pair. Declaring 3.10 here was true of this package
# alone and false of every way it is actually used.
requires-python = ">=3.11"
# PyYAML is a hard runtime dependency, not an optional convenience. The skill
# loader, the registry and the scout all parse YAML, and a skill manifest that
# cannot be read is not a skill. It was previously only *optionally* imported
# (`runtime/component.from_yaml` falls back to a hand-rolled reader), which is
# why it was never declared — and why a fresh install could not load the stable
# registry at all. Found by simulating CI in a clean virtualenv rather than by
# reading pyproject.toml.
dependencies = ["pandas>=2.0", "pyarrow>=14.0", "pyyaml>=6.0", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "build>=1.0", "openpyxl>=3.1"]
# Reading the formula table (中医方剂数据表.xlsx).
formulas = ["openpyxl>=3.1"]
# The analysis pipelines' optional pieces: implementations a run may select instead of
# the built-in ones (PyDESeq2 for differential expression; Scanpy, leidenalg and
# umap-learn for the single-cell stages; harmonypy, Harmony under the Scanpy backend),
# GSEApy for preranked GSEA, TM-align through tmtools, and readers for HDF5 count files
# (h5py, anndata). One extra rather than several because CI's analysis job installs it
# and fails, rather than skips, a test whose package is missing. The pipelines
# themselves need only the core dependencies; the command-line tools they use when
# present (fastp, salmon, kallisto, HISAT2, featureCounts) are installed by the system's
# package manager.
analysis = ["pydeseq2>=0.4", "scanpy>=1.9", "leidenalg>=0.10", "igraph>=0.10",
            "umap-learn>=0.5", "anndata>=0.9", "h5py>=3.8", "tmtools>=0.2",
            "gseapy>=1.1", "harmonypy>=2.0"]
# scVI integration (integration_method "scvi"): scvi-tools brings PyTorch and Lightning,
# too heavy for the analysis extra. It is not installed in CI, and that path is
# unverified (docs/omics-backends.md).
scvi = ["scvi-tools>=1.1"]
# Local structure prediction with ESMFold (large: torch and the model weights). The
# default predictor is the ESM Atlas service, which needs neither.
fold = ["torch>=2.0", "transformers>=4.30"]
# Docking: RDKit for ligands, meeko for receptor and ligand preparation (it reads mmCIF
# templates with gemmi), AutoDock Vina for the search.
docking = ["rdkit>=2023.9", "meeko>=0.6", "vina>=1.2.5", "gemmi>=0.6"]
# ADMET: RDKit for structures, descriptors and alerts; scikit-learn for the models.
admet = ["rdkit>=2023.9", "scikit-learn>=1.3"]
# MCP servers (bioagent.mcp): the official Python SDK. Below 2, because BioMCP and
# ToolUniverse, which an installation may sit beside, require mcp<2.
mcp = ["mcp>=1.29,<2"]
# The reviewed ToolUniverse tools (bioagent.providers.tooluniverse). Pinned to the release
# registry/tooluniverse_allowlist.yaml was reviewed against: any other release quarantines
# every tool until a person re-reviews it, so a looser pin would install nothing usable.
tooluniverse = ["tooluniverse==1.5.6"]
# The BioMCP server whose replies bioagent.providers.biomcp adapts
# (registry/biomcp_server.yaml), pinned for the same reason; it brings the MCP SDK.
biomcp = ["biomcp-python==0.7.3"]
# Literature evidence: PaperQA2 indexes and searches the caller's documents (its pypdf
# reader for PDF). The floor is the release whose source bioagent.literature.paperqa was
# written and tested against: it relies on paper-qa's character chunkers, Docs state and
# vector store, not only on its public answer API.
literature = ["paper-qa[pypdf]>=2026.8.12"]

[tool.setuptools.packages.find]
where = ["src"]

# Without this the wheel carried no catalogue at all: `pip install bioagent`
# installed a registry with nothing to index. Any runtime data added under
# src/bioagent/data/ must be matched here or it will be silently dropped again —
# tests/test_packaging.py builds a wheel and asserts the catalogue is inside it.
[tool.setuptools.package-data]
"bioagent.data" = ["*.csv", "*.json", "*.parquet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: no external data required; always runs",
  "integration: requires the Biomni data lake or network",
]
