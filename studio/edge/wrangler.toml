# TCMScience Studio — one Worker: static app, Tao-S1 relay /v1/*, data gateway /api/sources/*, telemetry
# /api/telemetry/* and the owner's analytics dashboard /admin/ with its API /api/admin/* (docs/TELEMETRY.md).
# Deployed by .github/workflows/studio.yml (SETUP.md). Its secrets are never written here or anywhere in the repository:
# MINIMAX_API_KEY (required for Tao-S1), VISITOR_SALT (optional), ADMIN_TOKEN (the dashboard; without it /admin is off)
# and EXPORT_TOKEN (optional, read-only aggregated exports) are set from the repository's Actions secrets.
name = "tcmscience-studio"
main = "src/index.js"
compatibility_date = "2026-09-01"
# request.signal: a visitor who stops an answer, or leaves, cancels the model call, which then costs nothing further
compatibility_flags = ["enable_request_signal"]
# no second public hostname: only science.impf.ai
workers_dev = false
preview_urls = false

# Cloudflare creates the DNS record and the certificate on the first deployment: the name must have no DNS record before
[[routes]]
pattern = "science.impf.ai"
custom_domain = true

# the app, as built by `python3 studio/scripts/build_web.py --out studio/_site` (the workflow copies _headers into it)
[assets]
directory = "../_site"
binding = "ASSETS"
# the model relay, the registered-source gateway, the telemetry and the admin pages run the Worker first; files are
# served directly (free, not counted). /admin/* is the Worker's to gate: the dashboard's code only to a signed-in admin.
run_worker_first = ["/v1/*", "/api/sources/*", "/api/telemetry/*", "/api/admin/*", "/admin", "/admin/*"]
# a path that matches no file goes to the Worker, which answers a browser's navigation with index.html (the app's own
# routes) and anything else with 404. "single-page-application" would answer index.html, with 200, to every miss,
# including a missing script or JSON file the app asked for.
not_found_handling = "none"

[vars]
# "off" stops Tao-S1 without touching the key: health says ok:false, a model call is refused (not_configured)
RELAY = "on"
# MiniMax's mainland platform; a key from the international platform (platform.minimax.io) needs https://api.minimax.io/v1
UPSTREAM_BASE = "https://api.minimax.cn/v1"
# the upstream model (the first is used); never shown to a visitor
MODELS = "MiniMax-M3"
# the only model name a visitor ever sees
PUBLIC_MODEL = "Tao-S1"
# merged into each upstream request for the keys the page did not send: reasoning in its own field, not in the text
UPSTREAM_FIELDS = '{"reasoning_split":true}'
# the upstream's reasoning formats (MiniMax-…) are shown as Tao-… and restored when the page sends them back
FORMAT_PREFIX = "MiniMax-"
MAX_OUTPUT_TOKENS = "8192"
# bytes, not characters (a CJK character is 3 bytes)
MAX_BODY_BYTES = "2000000"
# model calls. The agent makes one per round of tool use (up to 16 for a question), so these are higher than a chat
# page needs: per visitor per minute, per visitor per UTC day, all visitors per UTC day (0: no limit)
PER_MINUTE = "40"
PER_DAY = "1200"
TOTAL_PER_DAY = "20000"
# tokens (input + output, as the model service reports them) per visitor per UTC day, and for all visitors (0: no
# limit). Each round sends the conversation so far again, so a long question can cost several hundred thousand.
TOKENS_PER_DAY = "10000000"
TOTAL_TOKENS_PER_DAY = "200000000"
# exact origins of the pages that may call the relay: the site, and the app as the local runner serves it
ALLOWED_ORIGINS = "https://science.impf.ai,http://127.0.0.1:8765,http://localhost:8765"
HSTS_MAX_AGE = "15552000"
# Registry-only read access for all built-in data connectors (runtime/source-gateway.json).
# Same origin bypasses public APIs' browser CORS restrictions. No arbitrary URL proxy.
SOURCES = "on"
SOURCE_MAX_BODY_BYTES = "393216"
SOURCE_MAX_RESPONSE_BYTES = "8388608"
SOURCE_TIMEOUT_MS = "30000"
SOURCE_PER_MINUTE = "120"
SOURCE_PER_DAY = "3000"
SOURCE_TOTAL_PER_DAY = "50000"
# Telemetry (docs/TELEMETRY.md). Usage statistics: counts and timings, no text, no identifier that outlives a day;
# a visitor can switch them off, and Do Not Track / Global Privacy Control do. Conversation records: only after the
# visitor agrees to the notice, never for conversations with uploaded or project files, clinical tools or identifying
# text. "off" stops taking either (deletion requests still work).
TELEMETRY = "on"
TELEMETRY_CONVERSATIONS = "on"
# where a visitor is, as Cloudflare places the request: country (or territory, the notice's "country or region") | off
TELEMETRY_GEO = "country"
# the reporting day, hours from UTC (8: Beijing)
TELEMETRY_UTC_OFFSET = "8"
# bytes of one batch of usage events, of one conversation record
TELEMETRY_MAX_BODY_BYTES = "32768"
CONVERSATION_MAX_BODY_BYTES = "65536"
# per visitor (hashed address of the UTC day): batches of usage events, conversation records
TELEMETRY_PER_MINUTE = "60"
TELEMETRY_PER_DAY = "3000"
CONVERSATIONS_PER_MINUTE = "20"
CONVERSATIONS_PER_DAY = "500"
# retention, in days: per-turn and per-tool rows, daily counts, conversation records, security events; and the most
# conversation records held. Each Durable Object deletes what is older once a day (its alarm), and on demand.
RETENTION_EVENTS_DAYS = "90"
RETENTION_AGGREGATES_DAYS = "400"
RETENTION_CONVERSATIONS_DAYS = "90"
RETENTION_SECURITY_DAYS = "30"
CONVERSATION_MAX_RECORDS = "50000"
# a security event keeps a network prefix (IPv4 /24, IPv6 /48) and a monthly-keyed hash of the address; "flagged" also
# keeps the full address of a high-severity event (a scanner probe, a failed admin sign-in), for an investigation
SECURITY_RAW_IP = "off"
# how long a dashboard sign-in lasts (seconds)
ADMIN_SESSION_SECONDS = "3600"

# per visitor (IPv6 by /64) and Cloudflare location over ten seconds: checked before the body is read and before the
# Durable Object is asked. namespace_id is unique in the account (TaoChronos uses 7311, 7312, 7313).
[[ratelimits]]
name = "BURST"
namespace_id = "7321"
simple = { limit = 40, period = 10 }

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

# the telemetry, each kind in its own object and its own storage: usage statistics, conversation records, security events
[[durable_objects.bindings]]
name = "USAGE"
class_name = "UsageLog"

[[durable_objects.bindings]]
name = "CONVERSATIONS"
class_name = "ConversationLog"

[[durable_objects.bindings]]
name = "SECURITY"
class_name = "SecurityLog"

# SQLite-backed (the Durable Object storage of the Workers Free plan). Renaming or deleting a class needs a new
# migration entry; never edit one that has been deployed.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limiter"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["UsageLog", "ConversationLog", "SecurityLog"]

# metrics and the Worker's own one-line errors; not the per-request logs, which would keep visitors' addresses
[observability]
enabled = true

[observability.logs]
invocation_logs = false
