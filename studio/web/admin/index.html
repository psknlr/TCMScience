<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="same-origin">
  <meta name="color-scheme" content="light dark">
  <title>TCMScience Studio · 运营统计</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/admin/admin.css">
  <script type="module" src="/admin/dashboard.js"></script>
</head>
<body>
  <div class="dash">
    <header class="dash__head">
      <div>
        <h1 class="dash__title" id="title">TCMScience Studio · 运营统计</h1>
        <p class="dash__sub" id="sub"></p>
      </div>
      <div class="dash__actions">
        <button class="btn btn--small" type="button" id="lang" lang="en">English</button>
        <button class="btn btn--small" type="button" id="refresh">刷新</button>
        <form method="post" action="/api/admin/session/logout">
          <button class="btn btn--small" type="submit" id="signout">退出登录</button>
        </form>
      </div>
    </header>
    <div class="filters" id="filters" role="group" aria-label="筛选"></div>
    <p class="status-line" id="status" role="status" aria-live="polite"></p>
    <main class="content" id="content" aria-busy="true"></main>
  </div>
</body>
</html>
